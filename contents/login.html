<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
<div class="login-box">
        <h2>Login to NextTrip</h2>

        <form action="#" method="POST">
            <input type="text" placeholder="Enter Username" name="username" required>
            <input type="password" placeholder="Enter Password" name="password" required>

            <button class="login-btn" type="submit">Login</button>
        </form>

        <p class="signup-link">
            Don't have an account? <a href="/contents/signup.html">Sign Up</a>
        </p>
    </div>

     <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1350&q=80') 
                        no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 450px;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

      .login-box h2 {
            margin-bottom: 15px;
            color: #0078ff;
        }

        .login-box input {
            width: 90%;
            height: 80px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-btn {
            width: 95%;
            padding: 15px;
            background: #0078ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #005fcc;
        }

  .signup-link {
            margin-top: 15px;
            font-size: 15px;
        }

        .signup-link a {
            color: #0078ff;
            text-decoration: none;
        }
    </style>

         
</body>
</html>
